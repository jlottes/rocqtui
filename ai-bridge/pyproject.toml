[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocqtui-ai-bridge"
version = "0.0.0"
description = "AI suggestion bridge between rocqtui and llama-server"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ai-bridge = "ai_bridge.__main__:main"
ai-bridge-cli = "ai_bridge_cli.main:main"
ai-bridge-bench = "bench.compare_models:main"

[tool.setuptools.packages.find]
include = ["ai_bridge*", "ai_bridge_cli*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
